{% extends "base.html" %}
{% block title %}My Profile — BiteFlow{% endblock %}
{% block content %}
<div class="card" style="max-width:620px;margin:1rem auto;">
  <div class="card-body" style="padding:2rem;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;">
      <div>
        <h1 style="margin:0;font-size:1.5rem;">Account Profile</h1>
        <p style="margin:0.25rem 0 0;color:var(--muted);font-size:0.88rem;">
          Signed in as <strong>{{ user.username }}</strong> ({{ user.email }})
        </p>
      </div>
      <span class="badge badge-{{ user.role }}">{{ user.role | upper }}</span>
    </div>

    <form method="post" action="/profile">
      <div class="form-group">
        <label for="full_name">Full Name</label>
        <input id="full_name" name="full_name" type="text" class="form-control" value="{{ user.full_name }}" required />
      </div>
      <div class="form-group">
        <label for="phone">Phone</label>
        <input id="phone" name="phone" type="text" class="form-control" value="{{ user.phone }}" required />
      </div>
      <div class="form-group">
        <label for="address">Default Delivery Address</label>
        <textarea id="address" name="address" rows="2" class="form-control" required>{{ user.address }}</textarea>
      </div>
      <button type="submit" class="btn btn-primary">Save Profile</button>
    </form>
  </div>
</div>
{% endblock %}
