{% extends "base.html" %}
{% block title %}Create Account — BiteFlow{% endblock %}
{% block content %}
<div class="card" style="max-width:600px;margin:1.5rem auto;">
  <div class="card-body" style="padding:2.2rem;">
    <h1 style="margin:0 0 0.35rem;font-size:1.6rem;">Create Customer Account</h1>
    <p style="margin:0 0 1.5rem;color:var(--muted);font-size:0.92rem;">
      Your password is securely hashed with <strong>bcrypt</strong> before being stored in PostgreSQL.
    </p>

    <form method="post" action="/register">
      <div class="form-row">
        <div class="form-group">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" class="form-control" required />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" class="form-control" required />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="full_name">Full Name</label>
          <input id="full_name" name="full_name" type="text" class="form-control" required />
        </div>
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input id="phone" name="phone" type="text" class="form-control" placeholder="+90 5XX XXX XXXX" required />
        </div>
      </div>

      <div class="form-group">
        <label for="address">Delivery Address</label>
        <input id="address" name="address" type="text" class="form-control" placeholder="Street, District, City" required />
      </div>

      <div class="form-group">
        <label for="password">Password (min 6 characters)</label>
        <input id="password" name="password" type="password" class="form-control" minlength="6" required />
      </div>

      <button type="submit" class="btn btn-primary btn-block">Create Account</button>
    </form>

    <p style="margin-top:1.25rem;text-align:center;font-size:0.9rem;color:var(--muted);">
      Already have an account? <a href="/login" style="color:var(--brand);font-weight:700;">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}
