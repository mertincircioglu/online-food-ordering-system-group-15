services:
  db:
    image: postgres:16-alpine
    container_name: biteflow_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-biteflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biteflow_pass}
      POSTGRES_DB: ${POSTGRES_DB:-biteflow_db}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-biteflow} -d ${POSTGRES_DB:-biteflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: biteflow_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-biteflow}:${POSTGRES_PASSWORD:-biteflow_pass}@db:5432/${POSTGRES_DB:-biteflow_db}
      SECRET_KEY: ${SECRET_KEY:-biteflow-cmpe341-group15-secret-key-2026}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "${APP_PORT:-8000}:8000"

volumes:
  pgdata:
